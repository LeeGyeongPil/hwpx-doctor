[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hwpx-doctor"
version = "0.1.0"
description = "Integrity checker and safe fixer for generated HWPX (OWPML) documents: container, manifest, and ID-reference checks for CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["hwpx", "owpml", "hancom", "validator", "linter", "ci", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/hwpx-doctor"
Issues = "https://github.com/LeeGyeongPil/hwpx-doctor/issues"

[project.scripts]
hwpx-doctor = "hwpx_doctor.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hwpx_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
